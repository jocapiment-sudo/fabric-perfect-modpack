name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, build, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build bundle, validate packs
        run: npm run ci

      - name: Package .mcaddon
        run: npm run package

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: apotheosis-mcaddon
          path: dist/Apotheosis.mcaddon
          if-no-files-found: error
