// ===========================================================================
//  Apotheosis: Fabric Edition — build script
// ===========================================================================
//  `./build.sh` (or build.ps1) bootstraps Gradle and runs `build`.
//  Output: build/libs/apotheosis-fabric-1.20.1.jar  (also copied to dist/)
// ===========================================================================
plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'apotheosis-fabric-1.20.1'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_apotheosis" }
    }
}

// The deliverable keeps a stable, version-free name so it can be dropped into
// `mods/` without the version suffix confusing people (or the loader).
tasks.named('remapJar') {
    archiveFileName = 'apotheosis-fabric-1.20.1.jar'
}

tasks.register('copyToDist', Copy) {
    dependsOn tasks.named('remapJar')
    from(layout.buildDirectory.dir('libs'))
    include 'apotheosis-fabric-1.20.1.jar'
    into(layout.projectDirectory.dir('dist'))
}

tasks.named('build') {
    finalizedBy 'copyToDist'
}
